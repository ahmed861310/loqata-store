name: Build Loqata APK

on:
  workflow_dispatch:
  push:
    branches: [ "android-apk-v0.3.1" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build Debug APK
        run: gradle --no-daemon -p android-app assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Loqata-Android-v0.3.1-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK
        run: gradle --no-daemon -p android-app assembleRelease

      - name: Sign test release APK
        shell: bash
        run: |
          set -euo pipefail
          LOQATA_TEST_KEY_PASS="$(openssl rand -hex 24)"
          export LOQATA_TEST_KEY_PASS
          keytool -genkeypair -keystore "$RUNNER_TEMP/loqata-test.jks" \
            -storepass "$LOQATA_TEST_KEY_PASS" -keypass "$LOQATA_TEST_KEY_PASS" \
            -alias loqata-test -keyalg RSA -keysize 3072 -validity 365 \
            -dname "CN=Loqata Test Build,O=Loqata" -noprompt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 \
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/loqata-test-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/loqata-test.jks" --ks-key-alias loqata-test \
            --ks-pass env:LOQATA_TEST_KEY_PASS --key-pass env:LOQATA_TEST_KEY_PASS \
            --out Loqata-Android-v0.3.1-test-signed.apk "$RUNNER_TEMP/loqata-test-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            Loqata-Android-v0.3.1-test-signed.apk

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: Loqata-Android-v0.3.1-test-signed
          path: Loqata-Android-v0.3.1-test-signed.apk
          if-no-files-found: error
